name: Unzip site
on:
  workflow_dispatch:
  push:
    paths:
      - 'site.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          [ -f site.zip ] || exit 0
          unzip -oq site.zip
          rm site.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add site files"
          git push
