# قالب GitHub Action لتوليد الشروح كل يوم مجانًا (ريبو عام = دقايق Actions مجانية).
# حطّه في الريبو بإيدك على المسار:  .github/workflows/ai-bake.yml   (ما ينفعش يترفع جوه site.zip: التوكن الافتراضي مبيكتبش ملفات workflows)
# وبعدين: Settings ← Secrets and variables ← Actions ← New repository secret:  GEMINI_API_KEY (ولو عايز: GROQ_API_KEY)
# التشغيل اليدوي: تبويب Actions ← AI bake ← Run workflow.
name: AI bake
on:
  schedule:
    - cron: '30 9 * * *'          # 09:30 UTC كل يوم، بعد ما حصة Gemini بتتجدد (منتصف الليل بتوقيت المحيط الهادي)
  workflow_dispatch:
    inputs:
      limit:
        description: 'أقصى عدد أسئلة (0 = لحد ما تخلص الحصة)'
        default: '0'
permissions:
  contents: write
concurrency:
  group: ai-bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bake explanations (stops by itself when the free quota is used)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 tools/ai/run.py bake --limit "${{ inputs.limit || '0' }}"
      - name: Validate the cache
        run: python3 tools/ai/run.py check
      - name: Commit the new explanations
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ai tools/ai/state
          git diff --cached --quiet || (git commit -m "AI: new explanations" && git push)
